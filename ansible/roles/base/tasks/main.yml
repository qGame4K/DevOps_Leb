---
- name: Assert supported VM platform
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version is version('24.04', '==')
      - ansible_architecture in ['x86_64', 'aarch64']
- name: Install base packages and remote module dependencies
  ansible.builtin.apt:
    lock_timeout: 600
    name: [ca-certificates, curl, gnupg, openssh-server, ufw, python3-debian, python3-requests]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Add Docker official repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: '{{ ansible_distribution_release }}'
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
  register: docker_repository
  until: docker_repository is succeeded
  retries: 5
  delay: 3
- name: Install Docker Engine
  ansible.builtin.apt:
    lock_timeout: 600
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true
- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
